<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>Infinity Media Network | Full Story</title>
<style>
:root{--navy:#071426;--red:#e4032e;--gold:#d4af37;--paper:#f5f6f8;--ink:#17202a;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:9px 5%;font-size:12px;display:flex;justify-content:space-between}.mast{background:#fff;border-bottom:4px solid var(--red);padding:10px 5%}.brand{max-width:1100px;margin:auto;text-align:center}.brand h1{font:900 42px Georgia;margin:0}.brand p{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted)}nav{background:var(--navy);text-align:center}nav a{display:inline-block;color:#fff;text-decoration:none;padding:13px 16px;font-weight:800;font-size:13px}.wrap{max-width:900px;margin:30px auto;padding:0 20px}.back{display:inline-block;color:var(--navy);font-weight:800;text-decoration:none;margin-bottom:20px}.article{background:#fff;padding:30px;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0001}.kicker{color:var(--red);font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.article h2{font:900 clamp(34px,6vw,58px)/1.05 Georgia;margin:10px 0 12px}.meta{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}.lead{font:700 20px/1.6 Georgia;margin:20px 0}.body{font:18px/1.8 Georgia}.body p{margin:0 0 20px}.story-image{width:100%;max-height:520px;object-fit:cover;border-radius:8px;margin:10px 0 20px}.imn-video{margin:22px 0}.imn-video iframe,.imn-video video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}.imn-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.imn-gallery .story-image{margin:0;max-height:360px}@media(max-width:600px){.imn-gallery{grid-template-columns:1fr}}.actions{border-top:1px solid var(--line);margin-top:25px;padding-top:18px;display:flex;gap:10px;flex-wrap:wrap}.actions button,.actions a{background:var(--red);color:#fff;border:0;padding:11px 15px;border-radius:5px;text-decoration:none;font-weight:800;cursor:pointer}.notice{background:#fff3cd;border:1px solid #e0a800;padding:15px;border-radius:7px;margin-top:20px;font-size:13px}.footer{background:#050d18;color:#cbd5e1;text-align:center;padding:35px 20px;margin-top:40px;font-size:12px}@media(max-width:600px){.top{font-size:10px}.brand h1{font-size:34px}.article{padding:20px;border-radius:0;border-left:0;border-right:0}.wrap{padding:0;margin-top:15px}.body{font-size:17px}.lead{font-size:18px}nav a{padding:10px 9px;font-size:11px}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #071426;outline-offset:3px}</style>
</head>
<body>
<div class="top"><span>Infinity Media Network • Eastern Uganda • Uganda</span><span>Every Story Matters</span></div>
<header class="mast"><div class="brand"><h1>Infinity Media Network</h1><p>REAL STORIES • TRUSTED NEWS • EVERYDAY</p></div></header>
<nav><a href="index.html">Home</a><a href="index.html#latest">Latest News</a><a href="index.html#mbale">Mbale</a><a href="index.html#national">National</a><a href="index.html#sports">Sports</a><a href="index.html#global">Global</a></nav>
<main class="wrap"><a class="back" href="index.html">← Back to Infinity Media Network</a><article class="article" id="reader"><p>Loading story…</p></article></main>
<footer class="footer">© 2026 Infinity Media Network • Beyond Borders. Beyond Limits.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function render(){
 const params=new URLSearchParams(location.search); const q=params.get('id'); const slug=params.get('slug');
 const reader=document.getElementById('reader');
 let a=null;
 if(q){const raw=localStorage.getItem('mbaleArticle_'+q); if(raw){try{a=JSON.parse(raw)}catch(e){}}}
 if(!a && slug){try{const db=window.supabase.createClient('https://dwbgcaxwemrwheybdpya.supabase.co','sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8'); const r=await db.from('news').select('title,slug,excerpt,content,image_url,category,author,created_at,published').eq('slug',slug).eq('published',true).maybeSingle(); if(!r.error && r.data){a={title:r.data.title,category:r.data.category,meta:(r.data.author||'Infinity Media Network')+' • '+new Date(r.data.created_at).toLocaleDateString(),image:r.data.image_url,lead:r.data.excerpt,text:r.data.content}}}catch(e){}}
 if(!a){reader.innerHTML='<h2>Story not found</h2><p>This article could not be found. Return to Infinity Media Network and open the story again.</p><a class="actions" href="index.html">Return home</a>';return;}
 try{
  document.title=(a.title||'Full Story')+' | Infinity Media Network';
  let text=(a.text||'').trim();
  let gallery=[],video='';
  text=text.replace(/\\[IMN_GALLERY\\]([\\s\\S]*?)\\[\\/IMN_GALLERY\\]/g,(_,items)=>{gallery=items.split(/\\n+/).map(x=>x.trim()).filter(x=>/^https:\\/\\//i.test(x));return '';});
  text=text.replace(/\\[IMN_VIDEO\\]([\\s\\S]*?)\\[\\/IMN_VIDEO\\]/g,(_,url)=>{video=url.trim();return '';});
  const paragraphs=text.split(/\\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');
  const galleryHtml=gallery.length?'<div class="imn-gallery">'+gallery.map((url,i)=>'<img decoding="async" class="story-image" loading="lazy" src="'+esc(url)+'" alt="'+esc(a.title)+' photo '+(i+2)+'">').join('')+'</div>':'';
  let videoHtml='';
  if(video){let embed='';const yt=video.match(/(?:youtube\\.com\\/watch\\?v=|youtu\\.be\\/)([A-Za-z0-9_-]{6,})/);const vm=video.match(/vimeo\\.com\\/(\\d+)/);if(yt)embed='<iframe src="https://www.youtube-nocookie.com/embed/'+yt[1]+'" title="IMN video report" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';else if(vm)embed='<iframe src="https://player.vimeo.com/video/'+vm[1]+'" title="IMN video report" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';else if(/^https:\\/\\/.+\\.(mp4|webm)(?:[?#].*)?$/i.test(video))embed='<video controls playsinline preload="metadata" src="'+esc(video)+'"></video>';if(embed)videoHtml='<section class="imn-video"><h3>Video report</h3>'+embed+'</section>';}
  reader.innerHTML='<div class="kicker">'+esc(a.category||'NEWS')+'</div><h2>'+esc(a.title||'Infinity Media Network Story')+'</h2><div class="meta">'+esc(a.meta||'Infinity Media Network')+'</div>'+(a.image?'<img decoding="async" loading="lazy" class="story-image" src="'+esc(a.image)+'" alt="'+esc(a.title)+'">':'')+'<div class="lead">'+esc(a.lead||'Read the full story from Infinity Media Network.')+'</div><div class="body">'+paragraphs+'</div>'+galleryHtml+videoHtml+'<div class="actions"><button onclick="shareStory()">↗ Share Story</button><button onclick="copyStory()">Copy Link</button><a href="index.html">More News</a></div>';
 }catch(e){reader.innerHTML='<h2>Unable to open story</h2><p>Please return to the homepage and try again.</p>';}
}
function shareStory(){if(navigator.share){navigator.share({title:document.title,url:location.href})}else{navigator.clipboard.writeText(location.href);alert('Article link copied.');}}
function copyStory(){navigator.clipboard.writeText(location.href).then(()=>alert('Article link copied.'));}
render();
</script>
<script src="assets/mbale-media-ai.js" defer></script>
</body>
</html>
